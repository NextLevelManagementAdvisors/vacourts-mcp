services:
  vacourts-mcp:
    build: .
    image: vacourts-mcp:nlma
    container_name: vacourts-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      FASTMCP_HOME: /opt/vacourts-mcp/data/fastmcp
    network_mode: host
    working_dir: /opt/vacourts-mcp
    command: ["python", "-m", "server", "--transport", "http"]
    volumes:
      - /opt/vacourts-mcp:/opt/vacourts-mcp
